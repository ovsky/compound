# Pound — Android Gradle properties.
#
# Keep POUND_VERSION_NAME in step with the VERSION passed to
# `project(Pound ... VERSION ...)` in the top-level CMakeLists.txt.

org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Only ever build the ABI an ARM64 emulator can actually use; a 32-bit ABI would
# need a second translation layer to emulate AArch64.
android.defaults.buildfeatures.buildconfig=false
android.suppressUnsupportedCompileSdk=35

# Release builds are unsigned unless POUND_KEYSTORE_* environment variables are
# provided. See android-apk.yml for the CI wiring.
android.enableR8.fullMode=false